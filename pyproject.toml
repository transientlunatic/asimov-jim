[build-system]
requires = [
    "setuptools>=61.0",
    "setuptools_scm[toml]>=3.4.3",
    "wheel",
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_scheme = "release-branch-semver"
local_scheme = "no-local-version"

[project]
name = "asimov-jim"
dynamic = ["version"]
authors = [
    { name = "Daniel Williams", email = "daniel.williams@glasgow.ac.uk" },
]
description = "Jim (JimGW) parameter estimation pipeline integration for Asimov"
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Natural Language :: English",
]
requires-python = ">=3.11"
dependencies = [
    "asimov>=0.7",
    "tomli-w",
]

[project.optional-dependencies]
asimov = [
    "asimov>=0.7",
]
docs = [
    "sphinx",
    "numpydoc",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov",
]

[project.entry-points."asimov.pipelines"]
jim = "asimov_jim:Jim"

[project.urls]
"Source code" = "https://github.com/transientlunatic/asimov-jim"
"Jim (JimGW)" = "https://github.com/GW-JAX-Team/Jim"
"Asimov" = "https://github.com/transientlunatic/asimov"

[tool.setuptools]
packages = ["asimov_jim"]

[tool.setuptools.package-data]
asimov_jim = ["configs/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=asimov_jim --cov-report=html --cov-report=term"
